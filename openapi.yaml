openapi: 3.0.3
info:
  title: 见面聊后端 API
  version: 0.1.0
  description: 见面聊模块化后端工程基础接口。业务接口将按模块逐步补充。
paths:
  /api/v1/:
    get:
      operationId: v1_retrieve
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/moments/:
    get:
      operationId: listAdminMoments
      description: 管理员动态列表。
      summary: 查看动态管理列表
      parameters:
      - in: query
        name: keyword
        schema:
          type: string
        description: 动态关键词或服务者昵称
      - in: query
        name: page
        schema:
          type: integer
        description: 页码
      - in: query
        name: page_size
        schema:
          type: integer
        description: 每页数量
      - in: query
        name: provider_public_id
        schema:
          type: string
        description: 服务者公开 ID
      - in: query
        name: status
        schema:
          type: string
        description: 动态状态
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMomentListResponse'
          description: ''
  /api/v1/admin/moments/{moment_id}/:
    get:
      operationId: retrieveAdminMoment
      description: 管理员动态详情。
      summary: 查看动态审核详情
      parameters:
      - in: path
        name: moment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentResponse'
          description: ''
  /api/v1/admin/moments/{moment_id}/approve/:
    post:
      operationId: approveAdminMoment
      description: 管理员审核通过动态。
      summary: 审核通过动态
      parameters:
      - in: path
        name: moment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MomentReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MomentReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MomentReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentResponse'
          description: ''
  /api/v1/admin/moments/{moment_id}/reject/:
    post:
      operationId: rejectAdminMoment
      description: 管理员拒绝动态。
      summary: 审核拒绝动态
      parameters:
      - in: path
        name: moment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MomentReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MomentReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MomentReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentResponse'
          description: ''
  /api/v1/admin/news/:
    get:
      operationId: listAdminNews
      description: 管理员资讯列表和创建草稿。
      summary: 管理资讯列表
      parameters:
      - in: query
        name: keyword
        schema:
          type: string
        description: 标题或摘要关键词
      - in: query
        name: page
        schema:
          type: integer
        description: 页码
      - in: query
        name: page_size
        schema:
          type: integer
        description: 每页数量
      - in: query
        name: status
        schema:
          type: string
        description: 资讯状态
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'
          description: ''
    post:
      operationId: createAdminNews
      description: 管理员资讯列表和创建草稿。
      summary: 创建资讯草稿
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsArticleInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewsArticleInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsArticleInputRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsArticleResponse'
          description: ''
  /api/v1/admin/news/{news_id}/:
    get:
      operationId: retrieveAdminNews
      description: 管理员查看、编辑和逻辑删除资讯。
      summary: 查看管理资讯详情
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsArticleResponse'
          description: ''
    patch:
      operationId: updateAdminNews
      description: 管理员查看、编辑和逻辑删除资讯。
      summary: 编辑资讯草稿
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNewsUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNewsUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNewsUpdateRequestRequest'
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsArticleResponse'
          description: ''
    delete:
      operationId: deleteAdminNews
      description: 管理员查看、编辑和逻辑删除资讯。
      summary: 逻辑删除资讯
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/news/{news_id}/publish/:
    post:
      operationId: publishAdminNews
      description: 管理员发布资讯。
      summary: 发布资讯
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsVersionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewsVersionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsVersionRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsArticleResponse'
          description: ''
  /api/v1/admin/news/{news_id}/reject/:
    post:
      operationId: rejectAdminNews
      description: 管理员拒绝资讯。
      summary: 拒绝资讯
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewsReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsArticleResponse'
          description: ''
  /api/v1/admin/news/sources/:
    get:
      operationId: listAdminNewsSources
      description: 管理员外部资讯来源列表和创建。
      summary: 获取资讯来源
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NewsSourceResponse'
          description: ''
    post:
      operationId: createAdminNewsSource
      description: 管理员外部资讯来源列表和创建。
      summary: 创建资讯来源
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsSourceInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewsSourceInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsSourceInputRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSourceResponse'
          description: ''
  /api/v1/admin/news/sources/{source_code}/:
    patch:
      operationId: updateAdminNewsSource
      description: 管理员更新外部资讯来源配置。
      summary: 更新资讯来源
      parameters:
      - in: path
        name: source_code
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNewsSourceInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNewsSourceInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNewsSourceInputRequest'
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSourceResponse'
          description: ''
  /api/v1/admin/news/sync/:
    post:
      operationId: syncAdminNews
      description: 管理员一键获取最新资讯。
      summary: 同步外部最新资讯
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsSyncRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewsSyncRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsSyncRequestRequest'
      security:
      - BearerTokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSyncRunResponse'
          description: ''
  /api/v1/admin/news/sync/{run_no}/:
    get:
      operationId: retrieveAdminNewsSync
      description: 查询资讯同步任务状态。
      summary: 查询资讯同步状态
      parameters:
      - in: path
        name: run_no
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSyncRunResponse'
          description: ''
  /api/v1/admin/provider-applications/:
    get:
      operationId: v1_admin_provider_applications_list
      summary: 查看服务者申请列表
      parameters:
      - name: cursor
        required: false
        in: query
        description: 分页游标值
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProviderApplicationResponseList'
          description: ''
  /api/v1/admin/provider-applications/{application_no}/:
    get:
      operationId: v1_admin_provider_applications_retrieve
      summary: 查看单个服务者申请
      parameters:
      - in: path
        name: application_no
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderApplicationResponse'
          description: ''
  /api/v1/admin/provider-applications/{application_no}/approve/:
    post:
      operationId: v1_admin_provider_applications_approve_create
      summary: 审核通过服务者申请
      parameters:
      - in: path
        name: application_no
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProviderReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProviderReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderApplicationResponse'
          description: ''
  /api/v1/admin/provider-applications/{application_no}/reject/:
    post:
      operationId: v1_admin_provider_applications_reject_create
      summary: 拒绝服务者申请
      parameters:
      - in: path
        name: application_no
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProviderReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProviderReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderApplicationResponse'
          description: ''
  /api/v1/admin/provider-services/:
    get:
      operationId: listAdminProviderServices
      description: 管理员查看全平台服务列表。
      summary: 查看服务管理列表
      parameters:
      - in: query
        name: category_code
        schema:
          type: string
        description: 服务类目代码
      - in: query
        name: keyword
        schema:
          type: string
        description: 服务名称或服务者昵称
      - in: query
        name: page
        schema:
          type: integer
        description: 页码，从 1 开始
      - in: query
        name: page_size
        schema:
          type: integer
        description: 每页数量，最大 100
      - in: query
        name: provider_public_id
        schema:
          type: string
        description: 服务者对外用户 UUID
      - in: query
        name: status
        schema:
          type: string
        description: 服务状态筛选
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceListResponse'
          description: ''
  /api/v1/admin/provider-services/{service_id}/:
    get:
      operationId: v1_admin_provider_services_retrieve
      description: 管理员查看服务详情接口。
      summary: 查看服务审核详情
      parameters:
      - in: path
        name: service_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
          description: ''
  /api/v1/admin/provider-services/{service_id}/approve/:
    post:
      operationId: v1_admin_provider_services_approve_create
      description: 管理员审核通过服务接口。
      summary: 审核通过服务
      parameters:
      - in: path
        name: service_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
          description: ''
  /api/v1/admin/provider-services/{service_id}/reject/:
    post:
      operationId: v1_admin_provider_services_reject_create
      description: 管理员审核拒绝服务接口。
      summary: 审核拒绝服务
      parameters:
      - in: path
        name: service_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
          description: ''
  /api/v1/admin/refund-requests/:
    get:
      operationId: listAdminOrderRefundRequests
      description: 后台退款申请列表查询。
      summary: 查询退款申请列表
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 页码
      - in: query
        name: page_size
        schema:
          type: integer
        description: 每页数量
      - in: query
        name: status
        schema:
          type: string
        description: 退款申请状态
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefundRequestListResponse'
          description: ''
  /api/v1/admin/refund-requests/{request_no}/approve/:
    post:
      operationId: approveOrderRefundRequest
      description: 后台同意退款申请并执行全额退款。
      summary: 同意退款申请
      parameters:
      - in: path
        name: request_no
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRefundReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderRefundReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderRefundReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefundRequest'
          description: ''
  /api/v1/admin/refund-requests/{request_no}/reject/:
    post:
      operationId: rejectOrderRefundRequest
      description: 后台拒绝退款申请。
      summary: 拒绝退款申请
      parameters:
      - in: path
        name: request_no
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRefundReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderRefundReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderRefundReviewRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefundRequest'
          description: ''
  /api/v1/admin/refund-requests/{request_no}/retry/:
    post:
      operationId: retryOrderRefundRequest
      description: 后台重新处理退款失败的申请。
      summary: 重新处理退款申请
      parameters:
      - in: path
        name: request_no
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRefundRetryRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderRefundRetryRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderRefundRetryRequestRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefundRequest'
          description: ''
  /api/v1/admin/search/trending/:
    get:
      operationId: listAdminTrendingSearch
      description: 管理员查看和创建热门搜索配置接口。
      summary: 管理热门搜索配置
      tags:
      - v1
      security:
      - BearerTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrendingListResponse'
          description: ''
    post:
      operationId: createAdminTrendingSearch
      description: 管理员查看和创建热门搜索配置接口。
      summary: 创建人工热门搜索
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTrendingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTrendingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTrendingCreateRequest'
        required: true
      security:
      - BearerTokenAuth: []
      responses:
        '201':
          content:
