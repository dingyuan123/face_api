components:
  schemas:
    AccountTypeEnum:
      enum:
      - PROVIDER_INCOME
      - REFERRAL_REWARD
      type: string
      description: |-
        * `PROVIDER_INCOME` - PROVIDER_INCOME
        * `REFERRAL_REWARD` - REFERRAL_REWARD
    ActionEnum:
      enum:
      - AVAILABLE
      - REST
      type: string
      description: |-
        * `AVAILABLE` - AVAILABLE
        * `REST` - REST
    AdminMomentListResponse:
      type: object
      description: 管理员动态列表响应。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MomentResponse'
          description: 动态列表
        total:
          type: integer
          description: 筛选后的动态总数
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页数量
        summary:
          allOf:
          - $ref: '#/components/schemas/MomentSummary'
          description: 全平台动态状态汇总
      required:
      - items
      - page
      - page_size
      - summary
      - total
    AdminServiceListResponse:
      type: object
      description: 管理员服务列表响应。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminServiceResponse'
          description: 服务列表
        total:
          type: integer
          description: 筛选后的服务总数
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页数量
        summary:
          allOf:
          - $ref: '#/components/schemas/AdminServiceSummary'
          description: 全平台服务状态汇总
      required:
      - items
      - page
      - page_size
      - summary
      - total
    AdminServiceProvider:
      type: object
      description: 管理员服务列表中的服务者摘要。
      properties:
        user_public_id:
          type: string
          format: uuid
          description: 服务者对外用户标识
        nickname:
          type: string
          nullable: true
          description: 服务者昵称
        phone_masked:
          type: string
          description: 脱敏手机号
      required:
      - nickname
      - phone_masked
      - user_public_id
    AdminServiceResponse:
      type: object
      description: 管理员服务列表对象。
      properties:
        id:
          type: string
          format: uuid
          description: 对外服务 UUID
        version:
          type: integer
          description: 服务版本号
        title:
          type: string
          description: 服务名称
        category_code:
          type: string
          description: 服务类目代码
        pricing_unit:
          type: string
          description: 计价单位，当前固定为 HOUR 按小时计价
        price:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: 服务每小时价格
        price_display:
          type: string
          description: 只读每小时价格展示字符串，不作为提交值
        duration_minutes:
          type: integer
          description: 服务时长，单位为分钟
        introduction:
          type: string
          description: 服务介绍
        cover_media:
          allOf:
          - $ref: '#/components/schemas/MediaAssetSummary'
          description: 服务封面媒体摘要
        gallery_media:
          type: array
          items:
            $ref: '#/components/schemas/MediaAssetSummary'
          description: 服务图集媒体摘要
        tag_codes:
          type: array
          items:
            type: string
          description: 服务标签代码
        location_type:
          type: string
          description: 服务地点类型
        status:
          type: string
          description: 服务状态
        reject_reason:
          type: string
          description: 审核拒绝原因
        sold_count:
          type: integer
          description: 累计已售数量，只读
        updated_at:
          type: string
          format: date-time
          description: 服务最近更新时间
        provider:
          allOf:
          - $ref: '#/components/schemas/AdminServiceProvider'
          description: 服务归属服务者摘要
      required:
      - category_code
      - cover_media
      - duration_minutes
      - gallery_media
      - id
      - introduction
      - location_type
      - price
      - price_display
      - pricing_unit
      - provider
      - reject_reason
      - sold_count
      - status
      - tag_codes
      - title
      - updated_at
      - version
    AdminServiceSummary:
      type: object
      description: 管理员服务状态汇总。
      properties:
        total:
          type: integer
          description: 全部未删除服务数量
        draft:
          type: integer
          description: 草稿数量
        pending:
          type: integer
          description: 审核中数量
        approved:
          type: integer
          description: 审核通过数量
        online:
          type: integer
          description: 已上架数量
        offline:
          type: integer
          description: 已下架数量
        rejected:
          type: integer
          description: 审核拒绝数量
        sold_count:
          type: integer
          description: 累计已售数量
      required:
      - approved
      - draft
      - offline
      - online
      - pending
      - rejected
      - sold_count
      - total
    AdminTrendingCreateRequest:
      type: object
      description: 管理员创建人工热门搜索请求。
      properties:
        display_keyword:
          type: string
          minLength: 1
          description: 热门搜索展示词，最多 100 个字符
        display_status:
          allOf:
          - $ref: '#/components/schemas/DisplayStatusEnum'
          default: ACTIVE
          description: |-
            初始展示状态：展示、下线或屏蔽

            * `ACTIVE` - ACTIVE
            * `HIDDEN` - HIDDEN
            * `BLOCKED` - BLOCKED
        manual_priority:
          type: integer
          minimum: 0
          default: 0
          description: 人工置顶优先级，数值越小越靠前，0 表示不置顶
      required:
      - display_keyword
    AdminTrendingCreateResponse:
      type: object
      description: 管理员创建热门搜索幂等响应。
      properties:
        keyword:
          type: string
          description: 规范化热门搜索词
        display_text:
          type: string
          description: 热门搜索展示词
        hot_type:
          allOf:
          - $ref: '#/components/schemas/HotTypeEnum'
          description: |-
            热门来源：自动热度或人工配置

            * `AUTO` - AUTO
            * `MANUAL` - MANUAL
        hot_score:
          type: integer
          nullable: true
          description: 热度分数；未配置公开展示时为空
        rank:
          type: integer
          description: 热榜名次，从 1 开始
        updated_at:
          type: string
          format: date-time
          description: 热门搜索最近更新时间
        trending_id:
          type: string
          format: uuid
