<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}测试管理后台{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink: #243044; --muted: #708096; --line: #dfe7f1; --brand: #3b82f6; --bg: #f5f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shell { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a { color: var(--ink); text-decoration: none; padding: 8px 12px; border-radius: 8px; }
    .nav a:hover, .nav a.active { background: #e6efff; color: var(--brand); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
    h1, h2 { margin: 0 0 12px; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    .muted { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .stat { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fbfdff; }
    .stat b { display: block; font-size: 28px; color: var(--brand); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .status { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #eef2f7; }
    .status.PASSED, .status.APPROVED { background: #e6f8ed; color: #19733b; }
    .status.PENDING { background: #fff4d9; color: #8b5e00; }
    .status.REJECTED, .status.FAILED { background: #ffe8e8; color: #a22c2c; }
    .btn { border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; font-weight: 700; }
    .btn.primary { background: var(--brand); color: #fff; }
    .btn.danger { background: #d9485f; color: #fff; }
    .btn.secondary { background: #eef2f7; color: var(--ink); }
    form.inline { display: inline; }
    label { display: block; margin: 12px 0 5px; color: var(--muted); }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    .error { background: #ffe8e8; color: #a22c2c; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
    .media { width: 160px; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .media-grid { display: flex; gap: 12px; flex-wrap: wrap; }
    .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .detail dt { color: var(--muted); margin-top: 8px; }
    .detail dd { margin: 2px 0 0; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">见面聊 · 测试管理后台</div>
      <nav class="nav">
        <a href="{% url 'management-dashboard' %}">总览</a>
        <a href="{% url 'management-identity-list' %}">实名审核</a>
        <a href="{% url 'management-provider-list' %}">服务者入驻</a>
        <a href="/admin/">Django Admin</a>
      </nav>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
