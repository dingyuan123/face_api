<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2329;
        background: #f5f6f8;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 860px;
        margin: 24px auto;
        padding: 32px;
        box-sizing: border-box;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(31, 35, 41, 0.08);
        line-height: 1.85;
      }
      h1, h2, h3, h4, h5, h6 {
        line-height: 1.4;
      }
      h1 {
        margin-top: 0;
        font-size: 30px;
      }
      h2 {
        margin-top: 36px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e5e6eb;
      }
      p, li {
        color: #3c4048;
      }
      code {
        padding: 2px 6px;
        border-radius: 5px;
        background: #f0f1f3;
      }
      pre {
        overflow-x: auto;
        padding: 16px;
        border-radius: 10px;
        background: #f7f8fa;
      }
      a {
        color: #1677ff;
      }
      @media (max-width: 640px) {
        main {
          margin: 0;
          padding: 22px 18px;
          border-radius: 0;
          box-shadow: none;
        }
        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content|safe }}
    </main>
  </body>
</html>
